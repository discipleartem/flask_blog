{% extends "base.html" %}
{% block title %}Редактировать комментарий · Flask Blog{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/easymde/easymde.min.css') }}">
{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8 col-xl-7">
    <h1 class="h3 mb-4">Редактировать комментарий</h1>
    <div class="card border">
      <div class="card-body p-3 p-md-4">
        <form method="post">
          <div class="mb-4">
            <label class="form-label" for="body_source">Текст</label>
            <textarea class="form-control js-markdown-editor" id="body_source" name="body_source" rows="4" required>{{ comment['body_source'] }}</textarea>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-dark">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('posts.detail', post_id=comment['post_id']) }}">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/syntax-highlight.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/easymde/easymde.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/markdown-editor.js') }}"></script>
{% endblock %}
