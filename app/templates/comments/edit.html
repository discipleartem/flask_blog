{% extends "base.html" %}
{% block title %}Редактировать комментарий · Flask Blog{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8 col-xl-7">
    <h1 class="h3 mb-4">Редактировать комментарий</h1>
    <div class="card border shadow-sm">
      <div class="card-body p-3 p-md-4">
        <form method="post">
          <div class="mb-4">
            <label class="form-label" for="body">Текст</label>
            <textarea class="form-control" id="body" name="body" rows="4" required>{{ comment['body'] }}</textarea>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-dark">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('posts.detail', post_id=comment['post_id']) }}">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
