{% extends "base.html" %}
{% block title %}Вход · Flask Blog{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <h1 class="h3 mb-4 text-center">Вход</h1>
    <div class="card border">
      <div class="card-body p-3 p-md-4">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="tag">Логин</label>
            <input class="form-control" type="text" id="tag" name="username"
                   placeholder="username#0001" required autocomplete="username">
            <div class="form-text">Формат Discord: имя#четыре цифры</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-control" type="password" id="password" name="password"
                   required autocomplete="current-password">
          </div>
          <div class="mb-4 form-check">
            <input class="form-check-input" type="checkbox" value="1"
                   id="remember" name="remember">
            <label class="form-check-label" for="remember">Запомнить меня</label>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-dark">Войти</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.register') }}">Регистрация</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
