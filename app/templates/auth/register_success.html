{% extends "base.html" %}
{% block title %}Аккаунт создан · Flask Blog{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <h1 class="h3 mb-4 text-center">Аккаунт создан</h1>
    <div class="card border shadow-sm">
      <div class="card-body p-3 p-md-4">
        <p class="mb-3">Сохраните полный логин в менеджере паролей браузера — без номера <code>#NNNN</code> войти не получится.</p>
        <form id="credentials" autocomplete="on">
          <div class="mb-3">
            <label class="form-label" for="tag">Логин</label>
            <input class="form-control" type="text" id="tag" name="username"
                   value="{{ tag }}" autocomplete="username" readonly>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-control" type="password" id="password" name="password"
                   value="{{ password }}" autocomplete="new-password" readonly>
          </div>
          <div class="d-grid">
            <a class="btn btn-dark" href="{{ url_for('posts.index') }}">Перейти к блогу</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const tag = document.getElementById("tag");
  const password = document.getElementById("password");
  if (!tag || !password || !window.PasswordCredential || !navigator.credentials) return;

  navigator.credentials.store(
    new PasswordCredential({ id: tag.value, password: password.value })
  ).catch(function () { /* user dismissed or unsupported */ });
})();
</script>
{% endblock %}
