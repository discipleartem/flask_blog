{% extends "base.html" %}
{% block title %}{% if post %}Редактировать{% else %}Новая статья{% endif %} · Flask Blog{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8 col-xl-7">
    <h1 class="h3 mb-4">{% if post %}Редактировать статью{% else %}Новая статья{% endif %}</h1>
    <div class="card border shadow-sm">
      <div class="card-body p-3 p-md-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="title">Заголовок</label>
            <input class="form-control" type="text" id="title" name="title" maxlength="200" required
                   value="{{ post['title'] if post else '' }}">
          </div>
          <div class="mb-4">
            <label class="form-label" for="body">Текст</label>
            <textarea class="form-control" id="body" name="body" rows="12" required>{{ post['body'] if post else '' }}</textarea>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-dark">{% if post %}Сохранить{% else %}Опубликовать{% endif %}</button>
            {% if post %}
            <a class="btn btn-outline-secondary" href="{{ url_for('posts.detail', post_id=post['id']) }}">Отмена</a>
            {% endif %}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
