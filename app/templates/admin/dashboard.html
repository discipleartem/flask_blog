{% extends "admin/layout.html" %}
{% block title %}Админка · Flask Blog{% endblock %}
{% block admin_content %}
<h1 class="h3 mb-4">Админ-панель</h1>
<div class="row g-3">
  <div class="col-12 col-md-4">
    <a class="text-decoration-none" href="{{ url_for('admin.users') }}">
      <div class="border rounded p-3 h-100">
        <div class="text-secondary small mb-1">Пользователи</div>
        <div class="display-6 text-body">{{ counts['users'] }}</div>
      </div>
    </a>
  </div>
  <div class="col-12 col-md-4">
    <a class="text-decoration-none" href="{{ url_for('admin.posts') }}">
      <div class="border rounded p-3 h-100">
        <div class="text-secondary small mb-1">Статьи</div>
        <div class="display-6 text-body">{{ counts['posts'] }}</div>
      </div>
    </a>
  </div>
  <div class="col-12 col-md-4">
    <div class="border rounded p-3 h-100">
      <div class="text-secondary small mb-1">Комментарии</div>
      <div class="display-6 text-body">{{ counts['comments'] }}</div>
      <p class="small text-secondary mb-0 mt-2">Открываются из списка статей.</p>
    </div>
  </div>
</div>
{% endblock %}
