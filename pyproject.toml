[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-blog"
version = "0.3.0"
description = "Blog on Flask with session auth, SQLite, and Bootstrap 5"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Artem" }]
dependencies = [
    "Flask==3.0.3",
    "python-dotenv==1.2.2",
    "Markdown==3.10.2",
    "nh3==0.3.6",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]
